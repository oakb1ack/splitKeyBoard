name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    defaults:
      run:
        working-directory: src/firmware
    strategy:
      fail-fast: false
      matrix:
        shield: [splitkeyboard_left, splitkeyboard_right]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize ZMK workspace
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
      - name: Build firmware
        run: |
          west build -s zmk/app -d build -b seeeduino_xiao_ble -- \
            -DSHIELD=${{ matrix.shield }} -DZMK_CONFIG="$PWD/config"
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shield }}
          path: src/firmware/build/zephyr/zmk.uf2
          if-no-files-found: error
